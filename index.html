nal-2010.webp 1x"]},{"id":"piel-liquida-2013","title":"LA PIEL LÍQUIDA","date":"2013","location":"Sevilla, España|Seville, Spain","description":"Edición y Correalización.|Editing and Co-direction.","achievements":[],"category":"audiovisual","image":"https://manolorecio.github.io/Manolo-Recio-Portfolio/images/la-piel-liquida.webp","links":[{"label":"Play|","url":"https://youtu.be/7bOlSjyLj34?si=FsBTOfXUFRJvEICE","type":"video"}],"gallery":[],"imageSet":["https://manolorecio.github.io/Manolo-Recio-Portfolio/images/la-piel-liquida.webp 1x"]},{"id":"luces-sombras-1999","title":"LUCES Y SOMBRAS: MUSEOS DE ANDALUCÍA","date":"1998-99","location":"Andalucía, España|Andalusia, Spain","description":"Edición y realización para Canal Sur TV.|Documentary Editing for Canal Sur TV.","achievements":["Premio ATEA 2001 · Mejor programa cultural|ATEA Award 2001 · Best cultural program"],"category":"audiovisual","image":"https://manolorecio.github.io/Manolo-Recio-Portfolio/images/luces-y-sombras.webp","links":[{"label":"Una pieza de un capítulo del documental|A clip from an episode of the show","url":"https://youtu.be/PQszcLgmuSk?si=XhKKdn4zYLO_02cD","type":"video"}],"gallery":[],"imageSet":["https://manolorecio.github.io/Manolo-Recio-Portfolio/images/luces-y-sombras.webp 1x"]},{"id":"espacio-vuelta-mundo","title":"Espacio Primera Vuelta al Mundo:\nUna imagen de marca para todo un espacio expositivo\n\n|First circumnavigation of the globe exhibition: A brand image for an entire exhibition space","date":"2019","location":"Sevilla, España|Seville, Spain","description":"Con motivo del 500 aniversario del inicio de la expedición de Magallanes-Elcano, abrió sus puertas un centro expositivo de la primera vuelta al Mundo, ubicado en Sevilla. \n\nJunto a Tannhauser Estudio, fui codiseñador y desarrollador de la exposición y se me encargó la imagen de la misma. \n\nEl logotipo logra capturar la esencia de la Nao Victoria de una manera sutil y estilizada, mediante un círculo con líneas geométricas que representa la proa estilizada de la Nao Victoria. Las líneas diagonales y verticales simulan la estructura del mascarón de proa, la parte frontal del barco que sobresale de la roda. \n\nLa combinación del icono y la tipografía crea una identidad visual coherente y memorable.\n\n|To mark the 500th anniversary of the start of the Magellan-Elcano expedition, an exhibition center dedicated to the first circumnavigation of the globe opened its doors in Seville. \n\nTogether with Tannhauser Estudio, I was co-designer and development of the exhibition and was commissioned to create its image. \n\nThe logo captures the essence of the Nao Victoria in a subtle and stylized way, using a circle with geometric lines that represents the stylized bow of the Nao Victoria. The diagonal and vertical lines simulate the structure of the figurehead, the front part of the ship that protrudes from the stem.","achievements":[],"category":"branding","image":"https://manolorecio.github.io/Manolo-Recio-Portfolio/images/espacio-vuelta-mundo-logo.webp","gallery":[],"imageSet":["https://manolorecio.github.io/Manolo-Recio-Portfolio/images/espacio-vuelta-mundo-logo.webp 1x"]},{"id":"the-lightmaster","title":"The Light Master:\nUna marca personal\n\n|The Light Master:\nA personal brand","date":"2016","location":"Sevilla, España|Seville, Spain","description":"Nacho Alcalá es diseñador y consultor de iluminación. Me encargó que le ideara su imagen de marca personal. \n\nEl logotipo de The Light Master es un diseño simbólico que representa la esencia de la iluminación y el montaje, combinando elementos gráficos y tipográficos de manera efectiva. \n\nEl icono principal es una representación estilizada de las letras \"N\" y \"A\" (Nacho Alcalá), que se combinan para formar una figura geométrica única. \n\nEl primer ángulo de la \"N\" simboliza la luz, representando la iluminación como elemento fundamental del trabajo de The Light Master. \n\nLa \"A\" invertida representa al montador, destacando la habilidad y la precisión en la instalación de equipos de iluminación. \n\nLa forma resultante de la combinación de las letras evoca la imagen de un foco, reforzando la idea de la iluminación como núcleo del negocio. \n\nEl logotipo de The Light Master es un diseño que combina simbolismo y funcionalidad. La representación de la luz y el montador en el icono principal comunica claramente los servicios ofrecidos por la empresa. El color azul refuerzan la imagen de profesionalismo y confianza. El nombre internacional \"THE LIGHT MASTER\" refleja la experiencia y la visión global de la empresa.\n\n|Nacho Alcalá is a lighting designer and consultant. He commissioned me to create his personal brand image. \n\nThe Light Master logo is a symbolic design that represents the essence of lighting and installation, effectively combining graphic and typographic elements. \n\nThe main icon is a stylized representation of the letters “N” and “A” (Nacho Alcalá), which combine to form a unique geometric shape. \n\nThe first angle of the \"N\" symbolizes light, representing lighting as a fundamental element of The Light Master's work. \n\nThe inverted “A” represents the installer, highlighting skill and precision in the installation of lighting equipment. \n\nThe shape resulting from the combination of the letters evokes the image of a spotlight, reinforcing the idea of lighting as the core of the business. The Light Master logo is a design that combines symbolism and functionality. The representation of light and the installer in the main icon clearly communicates the services offered by the company. The blue color reinforces the image of professionalism and trust. The international name \"THE LIGHT MASTER\" reflects the company's experience and global vision.","achievements":[],"category":"branding","image":"https://manolorecio.github.io/Manolo-Recio-Portfolio/images/the-light-master.webp","gallery":[],"imageSet":["https://manolorecio.github.io/Manolo-Recio-Portfolio/images/the-light-master.webp 1x"]},{"id":"cicerone","title":"Cicerone:\nUna app que sirve de guía a los profesionales del derecho\n\n|Cicerone:\nAn app that serves as a guide for lawyers","date":"2016","location":"Sevilla, España|Seville, Spain","description":"CICERONE es una aplicación móvil diseñada para servir como guía y asistente a profesionales del derecho. El nombre, evoca la figura del cicerone, un guía experimentado. \n\nEl logotipo, con su distintivo círculo azul, desdobla la marca en tres niveles: 'CICERONE', la guía legal completa; el círculo azul, que invita a la exploración global (anticipando la expansión de la app); y 'C1' (C One), una abreviatura moderna y angloparlante, que sugiere que CICERONE es la primera y principal guía para abogados.\n\n|\nCICERONE is a mobile application designed to serve as a guide and assistant for legal professionals. The name evokes the figure of the cicerone, an experienced guide. \n\nThe logo, with its distinctive blue circle, unfolds the brand on three levels: 'CICERONE', the comprehensive legal guide; the blue circle, which invites global exploration (anticipating the app's expansion); and 'C1' (C One), a modern, English-speaking abbreviation that suggests that CICERONE is the first and foremost guide for lawyers.","achievements":[],"category":"branding","image":"https://manolorecio.github.io/Manolo-Recio-Portfolio/images/cicerone.webp","gallery":[],"imageSet":["https://manolorecio.github.io/Manolo-Recio-Portfolio/images/cicerone.webp 1x"]},{"id":"dehesa","title":"La Dehesa del Jamón:\nUn restaurante que es un regalo\n\n|La Dehesa del Jamón:\nA restaurant that is a gift","date":"2025","location":"Sevilla, España|Seville, Spain","description":"Diseño de Logotipo y Desarrollo de Mobile-First SPA para la gestión de carta digital interactiva. Optimización de UX para acceso instantáneo sin descarga. \n\nEl logotipo de \"La Dehesa del Jamón\" es un diseño que fusiona la tradición con la modernidad, utilizando el jamón original como elemento tradicional pero reinterpretado de forma abstracta, geométrica y dinámica. \n\nSu disposición vertical evoca crecimiento y progresión, sintetizando la forma del jamón, convirtiéndolo en un \"envoltorio\" de la tradición y evolucionándolo a la variedad de la cocina y la versatilidad de los platos. \n\nLos colores vibrantes y dinámicos transmiten la pasión y el espíritu del equipo que lo conforma. \n\nEl logotipo es una invitación visual a una experiencia gastronómica. Su diseño, que atrapa la tradición y la envuelve en esta estética contemporánea, refleja la esencia del restaurante: honramos el pasado mientras abrazamos la evolución.\n\n|Logo design and development of a Mobile-First SPA for interactive digital menu management. UX optimization for instant access without downloads. \n\nThe logo for \"La Dehesa del Jamón\" is a design that blends tradition with modernity, using the original ham as a traditional element but reinterpreted in an abstract, geometric, and dynamic way. \n\nIts vertical layout evokes growth and progression, synthesizing the shape of the ham, turning it into a \"wrapping\" of tradition and evolving it into the variety of cuisine and versatility of dishes. \n\nThe vibrant and dynamic colors convey the passion and spirit of the team behind it. The logo is a visual invitation to a gastronomic experience. Its design, which captures tradition and envelops it in this contemporary aesthetic, reflects the essence of the restaurant: we honor the past while embracing evolution.","achievements":[],"category":"branding","image":"https://manolorecio.github.io/Manolo-Recio-Portfolio/images/dehesa-jamon.webp","links":[{"label":"Carta Digital · La Dehesa del Jamón|Digital Menu · La Dehesa del Jamón","url":"https://juanmadehesa-creator.github.io/carta-la-dehesa/","type":"link"}],"gallery":[],"imageSet":["https://manolorecio.github.io/Manolo-Recio-Portfolio/images/dehesa-jamon.webp 1x"]},{"id":"lexpire","title":"Lexpire:\nUna app que calcula los plazos judiciales\n\n|Lexpire:\nAn app that calculates court deadlines","date":"2016","location":"Sevilla, España|Seville, Spain","description":"Lexpire, de Legal Innovation, es la app gratuita que simplifica el cálculo de plazos legales. \n\nSu nombre surge de la fusión de \"ley\" y \"expiración\", reflejando su función esencial. \n\nEl logotipo, como un bloque de notas rojas como color de alerta y comunica organización y eficiencia. El punto rojo sobre la \"i\" es un detalle sutil que mantiene la coherencia visual con los cuadrados superiores, reforzando la idea de alerta y recordatorio. \n\nEn resumen, el logotipo de Lexpire es una representación visual de una herramienta diseñada para ayudar a los profesionales del derecho a gestionar sus plazos de manera efectiva, evitando errores y retrasos.\n\n|Lexpire, from Legal Innovation, is a free app that simplifies the calculation of legal deadlines. \n\nIts name comes from the fusion of \"law\" and \"expiration,\" reflecting its essential function. \n\nThe logo, like a red notepad, uses color as a warning and communicates organization and efficiency. The red dot above the \"i\" is a subtle detail that maintains visual consistency with the upper squares, reinforcing the idea of alert and reminder. \n\nIn short, the Lexpire logo is a visual representation of a tool designed to help legal professionals manage their deadlines effectively, avoiding errors and delays.","achievements":[],"category":"branding","image":"https://manolorecio.github.io/Manolo-Recio-Portfolio/images/lexpire.webp","gallery":[],"imageSet":["https://manolorecio.github.io/Manolo-Recio-Portfolio/images/lexpire.webp 1x"]},{"id":"graficut","title":"Graficut:\nUn revamp del diseño de marca\n\n|Graficut:\nA revamp of the brand design","date":"2016","location":"Bollullos de la Mitación, España|Bollullos de la Mitacion, Spain","description":"Graficut es una empresa especializada en soluciones visuales integrales, que abarca desde la impresión digital y el fresado CNC hasta la rotulación de alta calidad. \n\nSu logotipo, una evolución moderna del diseño anterior, transmite profesionalidad y eficiencia. La tipografía limpia y el minimalismo reflejan la precisión de su trabajo, mientras que el sutil énfasis en la letra \"A\" simboliza la atención al detalle y la precisión de sus trabajos.\n\n|Graficut is a company specializing in comprehensive visual solutions, ranging from digital printing and CNC milling to high-quality signage. \n\nIts logo, a modern evolution of the previous design, conveys professionalism and efficiency. The clean typography and minimalism reflect the precision of its work, while the subtle emphasis on the letter \"A\" symbolizes the attention to detail and precision of its work.","achievements":[],"category":"branding","image":"https://manolorecio.github.io/Manolo-Recio-Portfolio/images/graficut.webp","gallery":[],"imageSet":["https://manolorecio.github.io/Manolo-Recio-Portfolio/images/graficut.webp 1x"]},{"id":"con-arte","title":"CON ARTE · Bar & Restaurante:\nEl rebranding de un restaurante desde el arte\n\n|CON ARTE · Bar & Restaurant:\nThe rebranding of a restaurant through art.","date":"2023","location":"Sevilla, España|Seville, Spain","description":"CON ARTE BAR & RESTAURANTE emprende un rebranding estratégico que proyecta su sólida trayectoria desde 2004, fusionando la esencia de la tradición con un espíritu de vanguardia.\n\nEsta renovación visual, impulsada por el alma máter del establecimiento, busca relanzar y consolidar la excelencia que siempre ha sido su meta, elevando la experiencia del cliente a nuevas alturas en un espacio que es tanto barra como mesa.\n\nEl Alma del Trazo: CON ARTE, la Masterpiece en constante desarrollo\n\nHe transformado el nombre CON ARTE BAR & RESTAURANTE en el lienzo de una obra maestra en evolución. El logotipo, con su distintivo trazo orgánico y gestual, es un boceto artístico que encarna el recorrido vital del negocio: desde la meticulosa cocina y la vibrante barra, hasta la mesa del cliente, culminando en un servicio impecable y la satisfacción plena.\n\nEste \"recorrido laberíntico\" intrínseco en el diseño, simboliza el esfuerzo diario, los recovecos y vericuetos que se enfrentan con pasión para alcanzar la excelencia en cada uno de sus espacios. Integrado sutilmente, pero con presencia innegable, un signo \"+\" emerge de la composición, sugiriendo una mejora constante y el lema implícito: CON ARTE, CON MÁS ARTE.\n\nEl diseño del trazo no es meramente estético; es una declaración de intenciones. Expresa el cariño y la autenticidad con los que se elabora cada detalle en CON ARTE. Refleja cómo la tradición culinaria se fusiona con las demandas más vanguardistas, siempre dentro de los cánones de las \"reales comidas caseras\". Esta filosofía se rubrica en todas nuestras elaboraciones, desde el desayuno hasta el aperitivo, comida y sobremesa, y en la cuidada selección de cervezas, vinos y espirituosos, enfatizando la versatilidad de nuestra oferta para cualquier momento del día o la noche.\n\n|CON ARTE BAR & RESTAURANTE is undertaking a strategic rebranding that reflects its solid trajectory since 2004, merging the essence of tradition with an avant-garde spirit.\n\nThis visual renewal, driven by the establishment's alma mater, seeks to relaunch and consolidate the excellence that has always been its goal, elevating the customer experience to new heights in a space that is both bar and table.\n\nThe Soul of the Stroke: CON ARTE, a Masterpiece in Constant Development\n\nI have transformed the name CON ARTE BAR & RESTAURANTE into the canvas of an evolving masterpiece. The logo, with its distinctive organic and gestural stroke, is an artistic sketch that embodies the life journey of the business: from the meticulous kitchen and vibrant bar to the customer's table, culminating in impeccable service and full satisfaction.\n\nThis \"labyrinthine path\" intrinsic to the design symbolizes the daily effort and the twists and turns faced with passion to achieve excellence in every space. Subtly integrated, but with an undeniable presence, a \"+\" sign emerges from the composition, suggesting constant improvement and the implicit motto: CON ARTE, CON MÁS ARTE (WITH ART, WITH MORE ART).\n\nThe design of the stroke is not merely aesthetic; it is a statement of intent. It expresses the care and authenticity with which every detail is crafted at CON ARTE. It reflects how culinary tradition merges with the most avant-garde demands, always within the canons of \"real homemade meals.\" This philosophy is hallmarked in all our creations, from breakfast to appetizers, lunch, and after-dinner drinks, as well as in the carefully selected beers, wines, and spirits, emphasizing the versatility of our offering for any time of day or night.","achievements":[],"category":"branding","image":"https://manolorecio.github.io/Manolo-Recio-Portfolio/images/con-arte.webp","gallery":[],"imageSet":["https://manolorecio.github.io/Manolo-Recio-Portfolio/images/con-arte.webp 1x"]},{"id":"legal-innovation-y-submarcas-plataforma-tecnol-gica-para-profesionales-del-derecho-2016","title":"LEGAL INNOVATION y SUBMARCAS:\nPlataforma tecnológica para profesionales del derecho\n\n|LEGAL INNOVATION and SUB-BRANDS:\nTechnological platform for legal professionals","date":"2016","location":"Sevilla, España|Seville, Spain","description":"DISEÑO de MARCA, WEB y WEBMAIL|BRAND, WEB and WEBMAIL DESIGN","achievements":[],"category":"branding","image":"https://manolorecio.github.io/Manolo-Recio-Portfolio/images/legal-innovation.webp","gallery":[],"imageSet":["https://manolorecio.github.io/Manolo-Recio-Portfolio/images/legal-innovation.webp 1x"]},{"id":"el-caminito","title":"El Espíritu del Caminito","date":"2026","location":"Sevilla, España|Seville, Spain","description":"Diseño y Producción del cartel del documental|Design and production of the documentary poster","achievements":[],"category":"branding","image":"https://manolorecio.github.io/Manolo-R para dislexia.|\n\nThe Portable Digital Menu Editor for Hospitality bussines constitutes a standalone, single-payment software ecosystem with zero monthly fees (€0/month) that eliminates SaaS subscriptions to grant technological sovereignty to restaurateurs. It operates 100% offline-first from the venue's local computer, integrating a predictive allergen copilot (EU/local regulations), night-shift management, and one-click export to a lightweight HTML file linked to a permanent QR code.\n\nFor diners, the menu guarantees instantaneous loading (0.5s), total privacy without cookies, active allergen filtering, bilingual phonetic voice reading (Web Speech API), and universal accessibility (WCAG 2.1) featuring dyslexia-friendly support.","achievements":[],"category":"creative-engineering","image":"https://manolorecio.github.io/Manolo-Recio-Portfolio/images/carta-digital.webp","gallery":["https://manolorecio.github.io/Manolo-Recio-Portfolio/images/carta-digital-01.webp","https://manolorecio.github.io/Manolo-Recio-Portfolio/images/carta-digital-02.webp","https://manolorecio.github.io/Manolo-Recio-Portfolio/images/carta-digital-03.webp","https://manolorecio.github.io/Manolo-Recio-Portfolio/images/carta-digital-04.webp","https://manolorecio.github.io/Manolo-Recio-Portfolio/images/carta-digital-05.webp"],"links":[{"label":"Ver dossier interactivo|View interactive dossier","url":"https://manolorecio.github.io/dossier-carta-digital/","type":"web"},{"label":"Interactúa con la carta digital|Interact with the digital menu","url":"https://manolorecio.github.io/carta-digital/","type":"web"}],"imageSet":["https://manolorecio.github.io/Manolo-Recio-Portfolio/images/carta-digital.webp 1x"]}],"experience":[{"period":"2025-","company":"FREELANCE","description":"Diseño, desarrollo y consultoría gráfica, visual y escenográfica. | Graphic, visual, and scenic design, development, and consulting."},{"period":"2020-2024","company":"SNGULAR","description":"UI/UX, diseño, desarrollo y producción
