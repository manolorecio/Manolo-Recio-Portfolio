name: Deploy Portfolio
on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write      # Necesario para interactuar con Pages
  id-token: write   # Necesario para la autenticación moderna

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages # Asegúrate de que en Settings > Pages apunte a esta rama
          clean: true
